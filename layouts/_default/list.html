{{ define "body_classes" }}page-default-list{{ end }}

{{ define "main" }}
  <div class="intro">
    <h1>{{ .Title }}{{ if .Site.Params.addDot }}<span class="dot">.</span>{{ end }}</h1>
	<div class="content prose prose-invert">
      {{ .Content }}
    </div>
    {{ partial "docs/parent-link.html" . }}
    {{ partial "page-badges" . }}
  </div>
  {{ range .Pages }}
    {{ .Render "summary" }}
  {{ end }}
{{ end }}
