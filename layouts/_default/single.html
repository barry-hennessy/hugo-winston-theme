{{ define "body_classes" }}page-default-single{{ end }}

{{ define "main" }}
<div class="intro">
  <h1>{{ partial "headline.html" . }}</h1>
  {{ with .Params.image }}
  {{/* image_alt says what the image shows; without it, it is decoration. */}}
  <img src="{{ . | relURL }}" alt="{{ $.Params.image_alt }}" />
  {{ end }}
</div>

<div class="content prose prose-invert">
  {{ .Content }}
</div>
{{ partial "docs/listing.html" . }}
{{ end }}
